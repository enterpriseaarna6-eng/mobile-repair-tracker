name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize and Sync Android Platform
        run: |
          npx cap add android
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  }
              }
          }
          EOF
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
                  }
              }
          }
          EOF

          # Configure Android FileProvider XML
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <external-path name="external" path="." />
              <external-files-path name="external_files" path="." />
          </paths>
          EOF

          # Configure Android Permissions & FileProvider in AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml\/file_paths" \/><\/provider>\n<\/application>/' android/app/src/main/AndroidManifest.xml

          # Configure Android Native WebView Bridge & Download Listener
          mkdir -p android/app/src/main/java/com/repairtrack/ops
          cat << 'EOF' > android/app/src/main/java/com/repairtrack/ops/MainActivity.java
          package com.repairtrack.ops;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.DownloadListener;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.webkit.JavascriptInterface;
          import android.app.DownloadManager;
          import android.net.Uri;
          import android.os.Environment;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.Toast;
          import android.view.WindowManager;
          import android.media.MediaScannerConnection;
          import android.util.Base64;
          import java.io.File;
          import java.io.FileOutputStream;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              public class AndroidBridge {
                  Context context;

                  public AndroidBridge(Context ctx) {
                      this.context = ctx;
                  }

                  @JavascriptInterface
                  public void setKeepScreenOn(final boolean keepOn) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (keepOn) {
                                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                                  } else {
                                      getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                                  }
                              } catch (Exception ignored) {}
                          }
                      });
                  }

                  @JavascriptInterface
                  public void saveBase64ToDownloads(final String base64Data, final String filename, final String mimeType) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  byte[] data = Base64.decode(base64Data, Base64.DEFAULT);
                                  File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  if (!downloadsDir.exists()) {
                                      downloadsDir.mkdirs();
                                  }
                                  File destFile = new File(downloadsDir, filename);
                                  FileOutputStream fos = new FileOutputStream(destFile);
                                  fos.write(data);
                                  fos.flush();
                                  fos.close();

                                  MediaScannerConnection.scanFile(
                                      getApplicationContext(),
                                      new String[] { destFile.getAbsolutePath() },
                                      new String[] { mimeType },
                                      null
                                  );

                                  Toast.makeText(getApplicationContext(), "✓ Saved to Downloads: " + filename, Toast.LENGTH_LONG).show();
                              } catch (Exception e) {
                                  Toast.makeText(getApplicationContext(), "Save error: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void shareBase64File(final String base64Data, final String filename, final String mimeType) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  byte[] data = Base64.decode(base64Data, Base64.DEFAULT);
                                  File cacheDir = getCacheDir();
                                  File shareFile = new File(cacheDir, filename);
                                  FileOutputStream fos = new FileOutputStream(shareFile);
                                  fos.write(data);
                                  fos.flush();
                                  fos.close();

                                  Uri contentUri = androidx.core.content.FileProvider.getUriForFile(
                                      getApplicationContext(),
                                      getPackageName() + ".fileprovider",
                                      shareFile
                                  );

                                  Intent shareIntent = new Intent(Intent.ACTION_SEND);
                                  shareIntent.setType(mimeType);
                                  shareIntent.putExtra(Intent.EXTRA_STREAM, contentUri);
                                  shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);

                                  Intent chooser = Intent.createChooser(shareIntent, "Share " + filename);
                                  chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(chooser);
                              } catch (Exception e) {
                                  // Fallback to downloads save if share provider not handled
                                  saveBase64ToDownloads(base64Data, filename, mimeType);
                              }
                          }
                      });
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      // Prevent phone screen from sleeping while in the app
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                      WebView webView = this.getBridge().getWebView();
                      webView.addJavascriptInterface(new AndroidBridge(this), "AndroidApp");

                      webView.setDownloadListener(new DownloadListener() {
                          @Override
                          public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                              try {
                                  DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                                  if (mimeType != null && !mimeType.isEmpty()) {
                                      request.setMimeType(mimeType);
                                  }
                                  String cookie = CookieManager.getInstance().getCookie(url);
                                  if (cookie != null) {
                                      request.addRequestHeader("Cookie", cookie);
                                  }
                                  request.addRequestHeader("User-Agent", userAgent);
                                  request.setDescription("Downloading RepairTrack Report...");
                                  request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);

                                  String filename = URLUtil.guessFileName(url, contentDisposition, mimeType);
                                  request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, filename);

                                  DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                                  if (dm != null) {
                                      dm.enqueue(request);
                                      Toast.makeText(getApplicationContext(), "Downloading " + filename + "...", Toast.LENGTH_SHORT).show();
                                  }
                              } catch (Exception e) {
                                  try {
                                      android.content.Intent i = new android.content.Intent(android.content.Intent.ACTION_VIEW);
                                      i.setData(Uri.parse(url));
                                      startActivity(i);
                                  } catch (Exception ignored) {}
                              }
                          }
                      });
                  } catch (Exception ignored) {}
              }
          }
          EOF
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepairTrack-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "RepairTrack Ops Android APK v1.0.${{ github.run_number }}"
          body: |
            ## 📱 RepairTrack Ops Android APK
            Download the attached `.apk` file directly on your Android phone to install the RepairTrack mobile app.
            
            - **Live Server URL:** https://mobile-repair-tracker.vercel.app
            - **Live Cloud Database:** Supabase PostgreSQL
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
